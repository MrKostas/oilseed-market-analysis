<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
<title>Компоновка страницы Рынок растительных масел в РФ</title>
<desc>Схема по метаданным PBIX. Без данных, брендинга и персональных контактов. Не скриншот отчёта.</desc>
<rect width="1280" height="800" fill="#f7f9fb"/>
<text x="16" y="27" font-family="Arial,sans-serif" font-size="19" fill="#203b2b">Рынок растительных масел в РФ</text>
<text x="16" y="52" font-family="Arial,sans-serif" font-size="12" fill="#546572">Схема расположения визуалов • без исходных значений • не скриншот</text>
<g transform="translate(0,70)" font-family="Arial,sans-serif">
<rect x="888.4" y="464.8" width="369.2" height="223.6" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="895.4" y="479.8" font-size="12" fill="#354a40">Динамика: Динамика экспорта масла в разрезе</text>
<text x="895.4" y="494.8" font-size="12" fill="#354a40">заводов, тыс. т</text>
<rect x="604.0" y="162.7" width="653.5" height="284.3" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="611.0" y="177.7" font-size="12" fill="#354a40">Матрица: Производство и потребление масла холдингами и заводами, тыс. т</text>
<rect x="28.1" y="464.8" width="368.3" height="223.6" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="35.1" y="479.8" font-size="12" fill="#354a40">Динамика: Динамика производства масла, тыс. т</text>
<rect x="617.7" y="75.0" width="432.8" height="60.8" rx="5" fill="#e8f1e9" stroke="#9eb0a7"/>
<text x="624.7" y="90.0" font-size="9" fill="#354a40">Фильтр</text>
<rect x="459.2" y="464.8" width="369.0" height="224.0" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="466.2" y="479.8" font-size="12" fill="#354a40">Динамика: Динамика потребления масла в разрезе</text>
<text x="466.2" y="494.8" font-size="12" fill="#354a40">регионов, тыс. т</text>
<rect x="1032.2" y="64.0" width="224.5" height="65.8" rx="5" fill="#e8f1e9" stroke="#9eb0a7"/>
<text x="1039.2" y="79.0" font-size="9" fill="#354a40">Фильтр</text>
<rect x="237.6" y="290.0" width="121.7" height="56.6" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="244.6" y="305.0" font-size="9" fill="#354a40">KPI</text>
<rect x="28.1" y="170.1" width="540.2" height="277.1" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="35.1" y="185.1" font-size="12" fill="#354a40">Структура: Потребление масла по отраслям в разрезе регионов, тыс. т</text>
<rect x="458.3" y="75.0" width="121.7" height="76.4" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="465.3" y="90.0" font-size="9" fill="#354a40">KPI</text>
<rect x="19.8" y="70.7" width="121.7" height="80.6" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="26.8" y="85.7" font-size="9" fill="#354a40">KPI</text>
<rect x="151.4" y="70.7" width="120.2" height="80.6" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="158.4" y="85.7" font-size="9" fill="#354a40">KPI</text>
<rect x="322.5" y="70.7" width="121.7" height="80.6" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="329.5" y="85.7" font-size="9" fill="#354a40">KPI</text>
