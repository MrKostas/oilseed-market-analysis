<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
<title>Компоновка страницы Рынок растительных шротов в РФ</title>
<desc>Схема по метаданным PBIX. Без данных, брендинга и персональных контактов. Не скриншот отчёта.</desc>
<rect width="1280" height="800" fill="#f7f9fb"/>
<text x="16" y="27" font-family="Arial,sans-serif" font-size="19" fill="#203b2b">Рынок растительных шротов в РФ</text>
<text x="16" y="52" font-family="Arial,sans-serif" font-size="12" fill="#546572">Схема расположения визуалов • без исходных значений • не скриншот</text>
<g transform="translate(0,70)" font-family="Arial,sans-serif">
<rect x="617.4" y="157.0" width="640.2" height="294.7" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="624.4" y="172.0" font-size="12" fill="#354a40">Матрица: Производство шрота холдингами и заводами и потребление шрота по регионам, тыс. т</text>
<rect x="11.3" y="463.5" width="367.5" height="225.1" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="18.3" y="478.5" font-size="12" fill="#354a40">Динамика: Динамика производства шрота, тыс. т</text>
<rect x="617.4" y="75.0" width="433.2" height="60.5" rx="5" fill="#e8f1e9" stroke="#9eb0a7"/>
<text x="624.4" y="90.0" font-size="9" fill="#354a40">Фильтр</text>
<rect x="444.1" y="464.1" width="369.0" height="224.0" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="451.1" y="479.1" font-size="12" fill="#354a40">Динамика: Динамика потребления шрота в разрезе</text>
<text x="451.1" y="494.1" font-size="12" fill="#354a40">регионов, тыс. т</text>
<rect x="888.4" y="464.0" width="369.2" height="224.2" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="895.4" y="479.0" font-size="12" fill="#354a40">Динамика: Динамика экспорта шрота в разрезе</text>
<text x="895.4" y="494.0" font-size="12" fill="#354a40">заводов, тыс. т</text>
<rect x="1033.1" y="65.8" width="224.5" height="67.5" rx="5" fill="#e8f1e9" stroke="#9eb0a7"/>
<text x="1040.1" y="80.8" font-size="9" fill="#354a40">Фильтр</text>
<rect x="19.8" y="71.3" width="121.7" height="77.8" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="26.8" y="86.3" font-size="9" fill="#354a40">KPI</text>
<rect x="151.4" y="71.3" width="120.2" height="77.8" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="158.4" y="86.3" font-size="9" fill="#354a40">KPI</text>
<rect x="322.5" y="71.3" width="121.7" height="77.8" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="329.5" y="86.3" font-size="9" fill="#354a40">KPI</text>
<rect x="458.3" y="73.4" width="121.7" height="73.6" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="465.3" y="88.4" font-size="9" fill="#354a40">KPI</text>
<rect x="11.4" y="161.4" width="597.2" height="277.1" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="18.4" y="176.4" font-size="12" fill="#354a40">Структура: Потребление шрота по видам животных в разрезе регионов, тыс. т</text>
<rect x="248.8" y="272.2" width="122.0" height="77.1" rx="5" fill="#ffffff" stroke="#9eb0a7"/>
<text x="255.8" y="287.2" font-size="9" fill="#354a40">KPI</text>
</g></svg>
